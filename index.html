<!DOCTYPE html>
<html lang="en">

<head >
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group C Project Frontend</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-wrapper">
        <!-- NEWSLETTER SECTION -->
        <section class="newsletter-section">
            <div class="newsletter-card">
                <div class="newsletter-content">
                    <h2 class="newsletter-title">NEWSLETTER</h2>
                    <p class="newsletter-description">
                        Subscribe to get daily updates on new drops &amp; exciting deals
                    </p>
                    <form class="newsletter-form">
                        <input type="email" class="newsletter-input" placeholder="ENTER YOUR EMAIL"
                            aria-label="Enter your email" required />
                        <button type="submit" class="newsletter-button">
                            SUBSCRIBE
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- FOOTER SECTION -->
        <footer class="footer-section">
            <div class="footer-container">
                <div class="footer-column">
                    <h2 class="logo">ARTSY.</h2>
                </div>

                <div class="footer-column">
                    <a href="#">Home</a>
                    <a href="#">MarketPlace</a>
                    <a href="#">Auction</a>
                    <a href="#">Drops</a>
                </div>

                <div class="footer-column">
                    <a href="#">Blog</a>
                    <a href="#">Wallets</a>
                    <a href="#">Rate</a>
                    <a href="#">High Birds</a>
                </div>

                <div class="footer-contacts">
                    <div class="contact-item">
                        <img src="images/Vector (1).png" alt="Email icon" class="icon-img" />
                        <span>artsystudious@gmail.com</span>
                    </div>
                    <div class="contact-item">
                        <img src="images/Vector (2).png" alt="Location icon" class="icon-img" />
                        <span>Lagos, Nigeria.</span>
                    </div>
                </div>
            </div>
            <p class="copyright">
                Artsystudios &copy; 2025. All rights reserved.
            </p>
        </footer>
    </div>











    
   
</body>

</html>
